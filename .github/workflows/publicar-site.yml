# Publica o app no GitHub Pages a cada push no branch principal.
# Precisa de dois "secrets" no repositório (Settings > Secrets and variables > Actions):
#   VITE_SUPABASE_URL       URL do projeto Supabase
#   VITE_SUPABASE_ANON_KEY  chave pública "anon" do projeto
# e do GitHub Pages ativado com origem "GitHub Actions" (Settings > Pages).
name: Publicar site

on:
  push:
    branches: [claude/lovable-project-analysis-a1gaym]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
